; Pytest configuration for the CEO agent gateway (ceo_agent/).
;
;   pytest                                  # from the repo root: unit + integration
;   pytest ceo_agent/tests/test_unit.py     # no network, no Docker
;   pytest -m writes                        # the write test, off by default
;
; testpaths is scoped to ceo_agent/tests so a bare `pytest` at the repo root does
; not sweep up other teams' directories -- customer-agent/test_*.py are plain
; scripts, not pytest suites, and are not ours to run.

[pytest]
testpaths = ceo_agent/tests

; MCP ClientSessions and the anyio task groups underneath them are bound to the
; event loop that created them, so fixtures and tests must share one loop. A
; function-scoped loop would tear the transports down between tests.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

; The write test leaves rows in the real Customer Support database, so it is
; deselected unless asked for by name: `pytest -m writes`.
addopts = -m "not writes" --strict-markers

markers =
    integration: needs the live MCP servers (skipped cleanly when they are down)
    writes: writes to the real Customer Support database; off by default

; URL profile for integration tests. "local" is the default because tests are
; normally run from the host against composed services; inside the compose
; network use --profile docker or set GATEWAY_URL_PROFILE=docker.
; Precedence: --profile, then the GATEWAY_URL_PROFILE env var, then this.
gateway_profile = local
