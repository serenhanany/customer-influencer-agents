services:
  customer-agent:
    build: ./customer-agent
    container_name: customer-agent
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - EVENT_GENERATOR_URL=http://event-generator:8000
    depends_on:
      - event-generator
      - customer-support-mcp

  influencer-agent:
    build: ./influencer-agent
    container_name: influencer-agent
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - SOCIAL_NETWORK_BASE_URL=http://social-network:3000
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      - social-network

  customer-support-api:
    build: ./Customer_Support_System
    container_name: customer-support-api
    ports:
      - "8013:8001"
    volumes:
      - customer_support_data:/app/data
    environment:
      - CS_DB_PATH=/app/data/customer_support.db
  
  customer-support-mcp:
    build:
      context: ./Customer_Support_System
      dockerfile: Dockerfile.mcp
    container_name: customer-support-mcp
    ports:
      - "8010:8010"
    volumes:
      - customer_support_data:/app/data
    environment:
      - CS_DB_PATH=/app/data/customer_support.db
      - MCP_PORT=8010

  customer-support-dashboard:
    build: ./Customer_Support_System/cs-monitor
    container_name: customer-support-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - customer-support-api

  social-network:
    build: ./social_network
    container_name: social-network
    ports:
      - "3005:3000"
    env_file:
      - ./social_network/.env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - social_network_data:/app/data

  event-generator:
    build: ./event-generator
    container_name: event-generator
    ports:
      - "8006:8000"

volumes:
  customer_support_data:
  social_network_data:

# The internal chat MCP server (mcp_servers.yaml: id `chat`) is deliberately not
# a service here. It already is one -- `internal-messaging-mcp` in the separate
# `bitrix-internal-actors` project, backed by that stack's own postgres, redis and
# kafka. Declaring a second copy would build from a source tree outside this repo
# and, worse, stand up a second chat store: the CEO would post into one while the
# organization's actual chat was the other.
#
# So this joins that stack's network instead of duplicating it. The running
# container already answers to the alias `internal-messaging-mcp`, which is
# exactly the hostname the `docker` profile uses, so nothing else needs changing.
#
# Nothing here attaches to it yet -- the gateway has no Dockerfile and runs from
# the host, which is why `GATEWAY_URL_PROFILE=local` is the working configuration
# today. This is what a containerized gateway would attach to, and it is declared
# now so the `docker` URL in mcp_servers.yaml names something real.
#
# Requires that stack to be up: `docker compose -f ../bitrix-internal-actors/
# docker-compose.yml up -d`. An external network that does not exist is a hard
# compose failure, not a warning.
networks:
  chat:
    name: bitrix-internal-actors_default
    external: true
